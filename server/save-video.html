<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수정 영상 저장</title>
<style>body{margin:0;background:#11151c;color:#fff;font:17px/1.6 -apple-system,sans-serif}main{max-width:480px;margin:auto;padding:28px 22px}h1{font-size:27px}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;margin:14px 0;border:0;border-radius:14px;background:#ffd44a;color:#151515;text-align:center;font:700 17px -apple-system,sans-serif;text-decoration:none}button:disabled{opacity:.5}a{background:#303846;color:#fff}p{color:#cbd0d9}small{color:#aab2c1}video{width:100%;max-height:46vh;background:#000;border-radius:12px}</style>
<main><h1>수정 영상 저장</h1><p>영상을 준비한 뒤, 파일 공유 메뉴에서 저장하세요.</p><video id="video" controls playsinline preload="none"></video><button id="prepare">1. 영상 파일 준비</button><button id="share" hidden disabled>2. 영상 공유·저장</button><a id="download">MP4 파일 다운로드</a><p id="status" role="status" aria-live="polite"></p><small>아이폰에서 공유 메뉴에 ‘비디오 저장’이 표시되면 선택하세요. 표시되지 않으면 ‘파일에 저장’으로 받은 후 파일 앱에서 영상을 열고 공유 → 비디오 저장을 선택하세요. 앱 안에서 다운로드가 안 되면 이 화면을 Safari에서 열어주세요.</small></main>
<script>
const video=document.getElementById('video'),download=document.getElementById('download'),prepare=document.getElementById('prepare'),share=document.getElementById('share');
const query=new URLSearchParams(location.search);query.delete('download');const media='/bridge/file?'+query.toString();
video.src=media;download.href=media+'&download=1';download.download='haejja-reel.mp4';let file;
const statusText=document.getElementById('status');
prepare.onclick=async()=>{prepare.disabled=true;statusText.textContent='영상 파일을 준비하고 있어요…';try{const response=await fetch(media);if(!response.ok)throw Error('파일을 가져오지 못했어요. 링크가 만료됐다면 새 링크를 요청해 주세요.');const blob=await response.blob();file=new File([blob],'haejja-reel.mp4',{type:'video/mp4'});if(navigator.canShare&&navigator.canShare({files:[file]})){share.hidden=false;share.disabled=false;prepare.hidden=true;statusText.textContent='준비됐어요. 아래 영상 공유·저장을 눌러주세요.';}else{statusText.textContent='이 브라우저에서는 파일 공유를 지원하지 않아요. MP4 파일 다운로드를 이용하세요.';prepare.disabled=false;}}catch(e){statusText.textContent=e.message;prepare.disabled=false;}};
share.onclick=async()=>{try{await navigator.share({files:[file]});statusText.textContent='저장 메뉴에서 선택을 마쳐주세요.';}catch(e){statusText.textContent=e.name==='AbortError'?'저장을 취소했어요. 다시 누를 수 있어요.':'파일 공유를 열지 못했어요. MP4 파일 다운로드를 이용하세요.';}};
</script></html>
